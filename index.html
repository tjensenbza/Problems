<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Top 10 Aufgaben BZA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f4f8;
      color: #1e3a8a;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      align-items: center;
      background-color: #1e3a8a;
      padding: 10px 20px;
    }
    header img {
      height: 40px;
      margin-right: 15px;
    }
    header h1 {
      color: white;
      font-size: 1.5em;
      margin: 0;
    }
    main {
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #last-saved {
      font-size: 0.9em;
      color: #555;
      margin-bottom: 20px;
    }
    .list-container {
      display: flex;
    }
    .number-column {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-right: 10px;
    }
    .number-label {
      min-height: 140px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.5em;
      color: #1e3a8a;
    }
    .sortable-column {
      display: flex;
      flex-direction: column;
    }
    .list-item {
      width: 700px;
      box-sizing: border-box;
      background-color: #ffffff;
      border: 2px solid #1e40af;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      padding: 10px 15px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: box-shadow 0.2s;
      min-height: 140px;
    }
    .list-item:hover {
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }
    .drag-handle {
      cursor: grab;
      font-size: 1.4em;
      user-select: none;
      margin-bottom: 5px;
    }
    input.title {
      width: 100%;
      font-size: 1.1em;
      font-weight: 600;
      border: none;
      border-bottom: 2px solid #1d4ed8;
      color: #1e3a8a;
      outline: none;
      background: transparent;
      margin-bottom: 8px;
      box-sizing: border-box;
    }
    textarea,
    input.status {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      resize: vertical;
    }
    textarea {
      height: 60px;
    }
    button {
      background-color: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    #login-form {
      background: #fff;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      padding: 20px;
      width: 300px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    #logout-btn {
      background: transparent;
      border: none;
      color: #1e3a8a;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <img src="semco_logo.svg" alt="Logo">
    <h1>Top 10 Aufgaben BZA</h1>
  </header>
  <main>
    <div id="auth-section">
      <form id="login-form">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email" required style="width:100%; margin-bottom:10px; padding:8px;">
        <input type="password" id="password" placeholder="Passwort" required style="width:100%; margin-bottom:10px; padding:8px;">
        <button type="submit">Login</button>
      </form>
    </div>

    <div id="app-section" style="display:none;">
      <div id="last-saved">Letzte Änderung: nie</div>
      <div class="list-container">
        <div class="number-column" id="number-column"></div>
        <div class="sortable-column" id="sortable-column"></div>
      </div>
      <button id="save-btn">Speichern</button>
      <button id="logout-btn">Logout</button>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = "https://fdsedmqvonfsegyfvqwq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkc2VkbXF2b25mc2VneWZ2cXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDA3MTUsImV4cCI6MjA2NzAxNjcxNX0.85AKLlUGAtOsLm8Om6rx19ZpPBYF8kf3xrL6NiTPCME";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showApp();
      } else {
        showLogin();
      }
    }

    function showApp() {
      document.getElementById("auth-section").style.display = "none";
      document.getElementById("app-section").style.display = "block";
      renderList();
      setInterval(renderList, 2 * 60 * 1000);
    }

    function showLogin() {
      document.getElementById("auth-section").style.display = "block";
      document.getElementById("app-section").style.display = "none";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert("Login fehlgeschlagen: " + error.message);
      } else {
        showApp();
      }
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLogin();
    });

    async function fetchList() {
      const { data } = await supabase.from("top10_items").select("*").order("position");
      return data;
    }

    async function saveList() {
      const now = new Date().toISOString();
      const listItems = document.querySelectorAll(".sortable-column .list-item");

      for (let i = 0; i < listItems.length; i++) {
        const li = listItems[i];
        const id = parseInt(li.dataset.id, 10);
        const title = li.querySelector("input.title").value.trim();
        const comment = li.querySelector("textarea").value.trim();
        const status = li.querySelector("input.status").value.trim();

        await supabase.from("top10_items").update({
          position: i + 1, title, comment, status, last_updated: now
        }).eq("id", id);
      }

      updateLastSavedTime(now);
      alert("Liste gespeichert!");
    }

    function updateLastSavedTime(latestIso) {
      const date = new Date(latestIso);
      const formatted = date.toLocaleString("de-DE");
      document.getElementById("last-saved").textContent = `Letzte Änderung: ${formatted}`;
    }

    async function renderList() {
      const list = await fetchList();
      const numberColumn = document.getElementById("number-column");
      const sortableColumn = document.getElementById("sortable-column");
      numberColumn.innerHTML = "";
      sortableColumn.innerHTML = "";

      let latestUpdate = null;

      list.forEach((item, index) => {
        const numLabel = document.createElement("div");
        numLabel.className = "number-label";
        numLabel.textContent = index + 1;
        numberColumn.appendChild(numLabel);

        const li = document.createElement("div");
        li.className = "list-item";
        li.dataset.id = item.id;
        li.innerHTML = `
          <div class="drag-handle">☰</div>
          <input class="title" type="text" value="${item.title || ""}" />
          <textarea placeholder="Kommentar...">${item.comment || ""}</textarea>
          <input class="status" type="text" placeholder="Status..." value="${item.status || ""}" />
        `;
        sortableColumn.appendChild(li);

        if (item.last_updated) {
          const updatedDate = new Date(item.last_updated);
          if (!latestUpdate || updatedDate > latestUpdate) {
            latestUpdate = updatedDate;
          }
        }
      });

      if (latestUpdate) {
        const formatted = latestUpdate.toLocaleString("de-DE");
        document.getElementById("last-saved").textContent = `Letzte Änderung: ${formatted}`;
      } else {
        document.getElementById("last-saved").textContent = `Letzte Änderung: nie`;
      }

      new Sortable(sortableColumn, {
        animation: 150,
        handle: '.drag-handle',
      });
    }

    document.getElementById("save-btn").addEventListener("click", saveList);

    checkSession();
  </script>
</body>
</html>
